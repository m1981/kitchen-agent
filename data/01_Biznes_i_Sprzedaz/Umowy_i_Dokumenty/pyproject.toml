[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-umow"
version = "1.0.0"
description = "Generator dokumentacji prawnej dla zabudowy meblowej na wymiar"
requires-python = ">=3.10"
# Generator celowo stoi na samej bibliotece standardowej — umowa musi dać się
# wygenerować na dowolnej maszynie bez instalowania czegokolwiek.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
# Układ płaski (generator.py obok szablonów) — bez tego setuptools próbuje
# potraktować katalogi z .md jako pakiety i wywala się na autodiscovery.
py-modules = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --tb=short"
markers = [
    "prawne: reguły prawne — numeracja i spójność nazw dokumentów",
    "finanse: podział transz, zaokrąglenia, kwoty słownie",
    "e2e: pełne generowanie dokumentu wynikowego",
]
